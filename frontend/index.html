<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daniel Enrique Cáceres Torres — Desarrollador de Software</title>
    <meta
      name="description"
      content="Portafolio de Daniel Enrique Cáceres Torres, Ingeniero de Sistemas y desarrollador de software con PHP, Laravel, React y PostgreSQL. Experiencia en aplicaciones web para los sectores tributario, salud y académico."
    />
    <meta name="author" content="Daniel Enrique Cáceres Torres" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daniel Enrique Cáceres Torres — Desarrollador de Software" />
    <meta
      property="og:description"
      content="PHP · Laravel · React · PostgreSQL. Experiencia, proyectos y formación."
    />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#08121f" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
    />

    <!-- Aplica el tema antes de pintar para evitar el parpadeo.
         Sin preferencia guardada se respeta la del sistema. -->
    <script>
      try {
        var saved = localStorage.theme
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
